name: referral-bot

on:
  push:
    paths: ["taxopark-referral-bot/**", ".github/workflows/referral-bot.yml"]
  pull_request:
    paths: ["taxopark-referral-bot/**", ".github/workflows/referral-bot.yml"]

defaults:
  run:
    working-directory: taxopark-referral-bot

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: referral_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/referral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: python -m pytest -q --cov=src --cov-report=term
      - run: python scripts/check_coverage.py
