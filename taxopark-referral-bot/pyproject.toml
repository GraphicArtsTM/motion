[project]
name = "taxopark-referral-bot"
version = "1.0.0"
description = "Telegram-бот реферальной программы таксопарка Яндекс Go (ТЗ v6.0)"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.13.1",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "arq>=0.26",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "fluent.runtime>=0.4",
    "pydantic>=2.7,<2.10",
    "pydantic-settings>=2.2",
    "sentry-sdk>=2.0",
    "qrcode>=7.4",
    "pillow>=10.0",
    "sqladmin>=0.17",
    "itsdangerous>=2.1",
    "pyotp>=2.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "B905", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"scripts/translit_uz.py" = ["E702", "B023"]
"tests/**" = ["ASYNC109", "B017", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "src.core.*"
strict = true
disallow_any_generics = false
warn_return_any = false
