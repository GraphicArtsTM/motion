# Замените bot.example.uz на свой домен; первый сертификат:
# docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d bot.example.uz
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

server {
    listen 80;
    server_name bot.example.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bot.example.uz;
    ssl_certificate     /etc/letsencrypt/live/bot.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.uz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location /webhook/telegram { proxy_pass http://web:8000; proxy_set_header Host $host; }
    location /admin {
        limit_req zone=admin burst=40 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /health { proxy_pass http://web:8000; }
    location / { return 404; }
}
